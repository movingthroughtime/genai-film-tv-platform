<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio AI Console</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1f2630;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #7dd3fc;
        --accent-2: #a78bfa;
        --success: #2ea043;
        --warn: #f59e0b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: linear-gradient(135deg, #090d12, #101827 60%, #1b1027);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .container { max-width: 1360px; margin: 32px auto; padding: 24px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
      h1, h2 { margin-top: 0; }
      .badge {
        display: inline-block; padding: 6px 10px; border-radius: 999px; background: rgba(125, 211, 252, 0.14); color: var(--accent); font-size: 12px; font-weight: bold;
      }
      .layout { display: grid; grid-template-columns: 1.1fr 1.4fr; gap: 24px; }
      .panel { background: rgba(22, 27, 34, 0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
      label { display: block; margin-top: 12px; margin-bottom: 6px; color: var(--muted); }
      input, textarea, select, button {
        width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); background: var(--panel-2); color: var(--text); font-size: 14px;
      }
      textarea { min-height: 120px; resize: vertical; }
      button {
        margin-top: 18px; cursor: pointer; border: none; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0b1220; font-weight: 700;
      }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 12px; margin-top: 10px;
      }
      .status {
        display: inline-block; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: rgba(46, 160, 67, 0.14); color: #9be9a8;
      }
      .status.warn { background: rgba(245, 158, 11, 0.14); color: #fbbf24; }
      .status.danger { background: rgba(239, 68, 68, 0.14); color: #fca5a5; }
      .muted { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <h1>Studio AI Console</h1>
        <div class="badge">Film / TV Production</div>
      </div>

      <div class="grid">
        <section class="panel">
          <h2>Auth</h2>
          <label>Role</label>
          <select id="roleSelect">
            <option value="writer">writer</option>
            <option value="director">director</option>
            <option value="producer">producer</option>
            <option value="admin">admin</option>
          </select>
          <label>Email</label>
          <input id="email" value="admin@studio.local" />
          <label>Name</label>
          <input id="name" value="Admin User" />
          <button id="loginBtn">Log in</button>
          <div id="authStatus" class="muted" style="margin-top: 12px;">Not authenticated.</div>
        </section>

        <section class="panel">
          <h2>Project brief</h2>
          <label>Project title</label>
          <input id="projectTitle" value="Project Atlas" />
          <label>Description</label>
          <textarea id="projectDescription">A cinematic thriller in a rainy urban environment with a morally compromised protagonist.</textarea>
          <button id="createProjectBtn">Create project</button>
        </section>
      </div>

      <div class="layout">
        <section class="panel">
          <h2>New scene</h2>
          <label>Project ID</label>
          <input id="projectId" placeholder="Project id from the list" />
          <label>Scene title</label>
          <input id="sceneTitle" value="Night exterior chase" />
          <label>Scene brief</label>
          <textarea id="sceneBrief">A tense chase through a wet city block with neon reflections and a collapsing timeline.</textarea>
          <label>Tasks</label>
          <select id="sceneTasks" multiple>
            <option value="script" selected>script</option>
            <option value="storyboard" selected>storyboard</option>
            <option value="shotlist" selected>shotlist</option>
          </select>
          <button id="createSceneBtn">Queue generation</button>

          <h2 style="margin-top: 28px;">Prompt template</h2>
          <label>Name</label>
          <input id="templateName" value="Urban Thriller" />
          <label>Prompt</label>
          <textarea id="templatePrompt">Write a cinematic scene in the style of {tone} with a haptic sense of {location}. Keep the dialogue sharp and grounded.</textarea>
          <button id="createTemplateBtn">Save template</button>

          <h2 style="margin-top: 28px;">Model registry</h2>
          <label>Name</label>
          <input id="modelName" value="script-v2" />
          <label>Provider</label>
          <input id="modelProvider" value="openai" />
          <label>Type</label>
          <input id="modelType" value="script" />
          <label>Version</label>
          <input id="modelVersion" value="2.0.0" />
          <button id="createModelBtn">Register model</button>

          <h2 style="margin-top: 28px;">Asset upload</h2>
          <label>Asset key</label>
          <input id="assetKey" value="storyboards/night-exterior-chase.json" />
          <label>Type</label>
          <input id="assetType" value="application/json" />
          <label>Content</label>
          <textarea id="assetContent">{"scene":"night-exterior-chase","status":"queued"}</textarea>
          <button id="uploadAssetBtn">Upload asset</button>
        </section>

        <section class="panel">
          <h2>Projects</h2>
          <ul id="projectList"></ul>
          <h2 style="margin-top: 28px;">Jobs</h2>
          <ul id="jobList"></ul>
          <h2 style="margin-top: 28px;">Models</h2>
          <ul id="modelList"></ul>
          <h2 style="margin-top: 28px;">Approvals</h2>
          <ul id="approvalList"></ul>
        </section>
      </div>
    </div>

    <script src="/config.js"></script>
    <script>
      const API_BASE_URL = window.API_BASE_URL || 'http://localhost:4000';
      const projectList = document.getElementById('projectList');
      const jobList = document.getElementById('jobList');
      const modelList = document.getElementById('modelList');
      const approvalList = document.getElementById('approvalList');
      const authStatus = document.getElementById('authStatus');
      const projectIdInput = document.getElementById('projectId');
      let authToken = localStorage.getItem('studio_ai_token') || '';

      function headers() {
        return {
          'Content-Type': 'application/json',
          ...(authToken ? { Authorization: `Bearer ${authToken}` } : {})
        };
      }

      async function fetchJson(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: { ...headers(), ...(options.headers || {}) }
        });
        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || response.statusText);
        }
        return response.json();
      }

      function renderStatus(label, variant = '') {
        return `<span class="status ${variant}">${label}</span>`;
      }

      async function login() {
        const payload = {
          email: document.getElementById('email').value,
          name: document.getElementById('name').value,
          role: document.getElementById('roleSelect').value
        };

        const result = await fetchJson(`${API_BASE_URL}/api/auth/login`, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        authToken = result.token;
        localStorage.setItem('studio_ai_token', authToken);
        authStatus.textContent = `Authenticated as ${result.user.name} (${result.user.role})`;
        await loadProjects();
        await loadJobs();
        await loadModels();
        await loadApprovals();
      }

      async function loadProjects() {
        try {
          const projects = await fetchJson(`${API_BASE_URL}/api/projects`);
          projectList.innerHTML = '';

          if (!projects.length) {
            projectList.innerHTML = '<li class="muted">No projects yet.</li>';
            return;
          }

          projects.forEach((project) => {
            const li = document.createElement('li');
            li.innerHTML = `
              <strong>${project.title}</strong><br>
              <span class="muted">${project.id}</span><br>
              ${project.description || 'No description'}
            `;
            li.addEventListener('click', () => projectIdInput.value = project.id);
            projectList.appendChild(li);
          });
        } catch (err) {
          projectList.innerHTML = '<li class="muted">Log in to load projects.</li>';
        }
      }

      async function loadJobs() {
        try {
          const jobs = await fetchJson(`${API_BASE_URL}/api/jobs`);
          jobList.innerHTML = '';

          if (!jobs.length) {
            jobList.innerHTML = '<li class="muted">No jobs yet.</li>';
            return;
          }

          jobs.forEach((job) => {
            const li = document.createElement('li');
            li.innerHTML = `
              <strong>${job.taskType}</strong><br>
              <span class="muted">Job: ${job.id}</span><br>
              ${renderStatus(job.status || 'queued', job.status === 'approved' ? '' : job.status === 'rejected' ? 'danger' : 'warn')}
            `;
            jobList.appendChild(li);
          });
        } catch (err) {
          jobList.innerHTML = '<li class="muted">Unable to load jobs.</li>';
        }
      }

      async function loadModels() {
        try {
          const models = await fetchJson(`${API_BASE_URL}/api/models`);
          modelList.innerHTML = '';

          if (!models.length) {
            modelList.innerHTML = '<li class="muted">No models registered yet.</li>';
            return;
          }

          models.forEach((model) => {
            const li = document.createElement('li');
            li.innerHTML = `
              <strong>${model.name}</strong><br>
              <span class="muted">${model.type} • ${model.version}</span><br>
              ${renderStatus(model.status || 'active')}
            `;
            modelList.appendChild(li);
          });
        } catch (err) {
          modelList.innerHTML = '<li class="muted">Unable to load models.</li>';
        }
      }

      async function loadApprovals() {
        try {
          const approvals = await fetchJson(`${API_BASE_URL}/api/approvals`);
          approvalList.innerHTML = '';

          if (!approvals.length) {
            approvalList.innerHTML = '<li class="muted">No approvals yet.</li>';
            return;
          }

          approvals.forEach((approval) => {
            const li = document.createElement('li');
            li.innerHTML = `
              <strong>${approval.status}</strong><br>
              <span class="muted">Job: ${approval.jobId}</span><br>
              ${approval.comment || 'No comment'}
            `;
            approvalList.appendChild(li);
          });
        } catch (err) {
          approvalList.innerHTML = '<li class="muted">Approval list unavailable.</li>';
        }
      }

      document.getElementById('loginBtn').addEventListener('click', login);

      document.getElementById('createProjectBtn').addEventListener('click', async () => {
        try {
          const project = await fetchJson(`${API_BASE_URL}/api/projects`, {
            method: 'POST',
            body: JSON.stringify({
              title: document.getElementById('projectTitle').value,
              description: document.getElementById('projectDescription').value
            })
          });
          projectIdInput.value = project.id;
          await loadProjects();
        } catch (err) {
          authStatus.textContent = 'Log in first to create a project.';
        }
      });

      document.getElementById('createSceneBtn').addEventListener('click', async () => {
        try {
          const selected = Array.from(document.getElementById('sceneTasks').selectedOptions).map((option) => option.value);
          const payload = {
            title: document.getElementById('sceneTitle').value,
            brief: document.getElementById('sceneBrief').value,
            tasks: selected.length ? selected : ['script']
          };

          const result = await fetchJson(`${API_BASE_URL}/api/projects/${projectIdInput.value}/scenes`, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          console.log('Scene created:', result);
          await loadJobs();
        } catch (err) {
          authStatus.textContent = 'Please log in and select a project first.';
        }
      });

      document.getElementById('createTemplateBtn').addEventListener('click', async () => {
        try {
          const template = await fetchJson(`${API_BASE_URL}/api/templates`, {
            method: 'POST',
            body: JSON.stringify({
              name: document.getElementById('templateName').value,
              description: 'Studio generation template',
              template: document.getElementById('templatePrompt').value,
              variables: ['tone', 'location']
            })
          });
          console.log('Template created:', template);
        } catch (err) {
          authStatus.textContent = 'Only a producer or admin can save templates.';
        }
      });

      document.getElementById('createModelBtn').addEventListener('click', async () => {
        try {
          const payload = {
            name: document.getElementById('modelName').value,
            provider: document.getElementById('modelProvider').value,
            type: document.getElementById('modelType').value,
            version: document.getElementById('modelVersion').value,
            status: 'active',
            metadata: { createdFrom: 'studio-ui' }
          };
          const model = await fetchJson(`${API_BASE_URL}/api/models`, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          console.log('Model registered:', model);
          await loadModels();
        } catch (err) {
          authStatus.textContent = 'Only a producer or admin can register models.';
        }
      });

      document.getElementById('uploadAssetBtn').addEventListener('click', async () => {
        try {
          const payload = {
            key: document.getElementById('assetKey').value,
            type: document.getElementById('assetType').value,
            content: document.getElementById('assetContent').value,
            metadata: { source: 'studio-ui' }
          };
          const asset = await fetchJson(`${API_BASE_URL}/api/assets/upload`, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          console.log('Asset uploaded:', asset);
        } catch (err) {
          authStatus.textContent = 'Asset upload failed. Check your permissions or MinIO config.';
        }
      });

      if (authToken) {
        authStatus.textContent = 'Token restored from local storage.';
      }

      loadProjects();
      loadJobs();
      loadModels();
      loadApprovals();
      setInterval(loadJobs, 5000);
      setInterval(loadModels, 5000);
      setInterval(loadApprovals, 5000);
    </script>
  </body>
</html>
