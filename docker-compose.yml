version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: genai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build: ./backend
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml:8000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/genai
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
      - ml

  worker:
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml:8000
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      - redis
      - ml
      - minio

  ml:
    build: ./ml_service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo-key}
      MODEL_NAME: gpt-4o-mini
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
